<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDrag Race Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-mobile: 70px;
            --header-desktop: 90px;
            --eyebrow-mobile: 70px;
            --eyebrow-desktop: 55px;
            --bg-dark: #0a0118;
            --bg-secondary: #1a0f2e;
            --text-primary: #ffffff;
            --text-secondary: #b8a9d4;
            --accent-primary: #ff2d95;
            --accent-secondary: #a855f7;
            --accent-tertiary: #06b6d4;
            --win-color: #fbbf24;
            --high-color: #34d399;
            --safe-color: #94a3b8;
            --low-color: #fb923c;
            --btm-color: #ef4444;
            --elim-color: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-margin-top: var(--eyebrow-desktop);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0118 0%, #1a0f2e 50%, #0f0a1f 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.7;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(255, 45, 149, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            z-index: 1;
        }

        .section {
            padding-top: 40px;
            padding-bottom: 160px;
            overflow: visible;
        }

        @media (min-width: 728px) {
            .container {
                max-width: 728px;
                padding: 0 20px;
            }

            .section {
                padding-top: 64px;
                padding-bottom: 140px;
            }

            * {
                scroll-margin-top: var(--eyebrow-desktop);
            }
        }

        @media (min-width: 960px) {
            .container {
                max-width: 1200px;
                padding: 0 60px;
            }

            .section {
                padding-top: 80px;
                padding-bottom: 180px;
            }
        }

        header {
            background: rgba(10, 1, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ff2d95 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            text-shadow: none;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            font-weight: 700;
            margin: 3rem 0 1.5rem 0;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.01em;
        }

        h3 {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 2rem 0 0.75rem 0;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 1.125rem;
            font-weight: 500;
            opacity: 0.9;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .button {
            position: relative;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(255, 45, 149, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            margin: 0.5rem;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 45, 149, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-tertiary) 100%);
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .button-secondary:hover {
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        .button-small {
            padding: 10px 20px;
            font-size: 0.875rem;
        }

        .cast-selection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .pokemon-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .pokemon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at top right, rgba(255, 45, 149, 0.1), transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .pokemon-card:hover::before {
            opacity: 1;
        }

        .pokemon-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 16px 48px rgba(255, 45, 149, 0.3),
                        0 0 0 1px rgba(255, 45, 149, 0.3) inset;
            border-color: var(--accent-primary);
        }

        .pokemon-card.selected {
            border-color: var(--accent-primary);
            background: linear-gradient(135deg, rgba(255, 45, 149, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            box-shadow: 0 12px 40px rgba(255, 45, 149, 0.4),
                        0 0 0 2px var(--accent-primary) inset;
        }

        .pokemon-card.eliminated {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .pokemon-image {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 1rem;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .pokemon-card:hover .pokemon-image {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 12px 24px rgba(255, 45, 149, 0.8));
        }

        .pokemon-name {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            text-align: center;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }

        .stats {
            font-size: 0.8rem;
            margin-top: 0.75rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 0.4rem 0;
        }

        .track-record-table {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
            margin: 3rem 0;
        }

        .track-record-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .track-record-table th {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            padding: 1.25rem;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .track-record-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .track-record-table tr:hover {
            background: rgba(255, 45, 149, 0.1);
        }

        .placement-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            min-width: 60px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.05em;
        }

        .WIN {
            background: linear-gradient(135deg, var(--win-color), #f59e0b);
            color: black;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
        }
        .HIGH {
            background: var(--high-color);
            color: black;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.4);
        }
        .SAFE {
            background: var(--safe-color);
            color: white;
        }
        .LOW {
            background: var(--low-color);
            color: black;
            box-shadow: 0 4px 12px rgba(251, 146, 60, 0.4);
        }
        .BTM2 {
            background: var(--btm-color);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        .ELIM {
            background: var(--elim-color);
            color: white;
        }
        .RUNNER {
            background: linear-gradient(135deg, #e5e7eb, #9ca3af);
            color: black;
            box-shadow: 0 4px 12px rgba(156, 163, 175, 0.4);
        }
        .WINNER {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: black;
            box-shadow: 0 6px 16px rgba(251, 191, 36, 0.6);
        }

        .phase-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 2.5rem;
            margin: 3rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
        }

        .entrance-sequence {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .entrance-item {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
            animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .entrance-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(255, 45, 149, 0.4));
        }

        .entrance-quote {
            flex: 1;
            font-style: italic;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .promo-card {
            text-align: center;
            padding: 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .promo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 45, 149, 0.3),
                        0 0 0 1px rgba(255, 45, 149, 0.3) inset;
        }

        .promo-card img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .challenge-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .challenge-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .challenge-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(255, 45, 149, 0.3),
                        0 0 0 2px var(--accent-primary) inset;
        }

        .performance-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 3rem 0;
        }

        .performance-item {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .performance-item:hover {
            box-shadow: 0 6px 20px rgba(255, 45, 149, 0.2),
                        0 0 0 1px rgba(255, 45, 149, 0.2) inset;
        }

        .performance-queen {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 3rem 0;
        }

        .result-category {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .result-queens {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .queen-badge {
            padding: 10px 20px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(255, 45, 149, 0.3);
        }

        .lipsync-battle {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 3rem;
            border-radius: 24px;
            margin: 3rem 0;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
            position: relative;
            overflow: hidden;
        }

        .lipsync-battle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 45, 149, 0.15), transparent 70%);
            pointer-events: none;
        }

        .lipsync-queens {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 3rem 0;
            flex-wrap: wrap;
            gap: 3rem;
            position: relative;
            z-index: 1;
        }

        .lipsync-queen {
            text-align: center;
        }

        .lipsync-queen img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 8px 20px rgba(255, 45, 149, 0.6));
            transition: transform 0.3s ease;
        }

        .lipsync-queen:hover img {
            transform: scale(1.1);
        }

        .vs {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .producer-room {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 3rem;
            border-radius: 24px;
            margin: 3rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
        }

        .episode-override {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 16px;
            margin: 2rem 0;
            border: 1px solid var(--glass-border);
        }

        .placement-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .placement-select {
            padding: 0.75rem;
            border-radius: 10px;
            border: 2px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .placement-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(255, 45, 149, 0.2);
        }

        .drama-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 2rem;
            border-radius: 16px;
            margin: 2rem 0;
            border-left: 4px solid var(--win-color);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        0 0 0 1px var(--glass-border) inset;
        }

        .tea-spill {
            font-style: italic;
            margin: 1rem 0;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .storyline-tag {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border-radius: 16px;
            font-size: 0.8rem;
            margin: 0.25rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 45, 149, 0.3);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 3rem 0;
            flex-wrap: wrap;
        }

        .hidden {
            display: none;
        }

        .season-stats {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 3rem;
            border-radius: 24px;
            margin: 3rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 0 1px var(--glass-border) inset;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 45, 149, 0.2);
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 1rem;
            margin-top: 0.75rem;
