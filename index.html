<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDrag Race Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-primary: #FF69B4;
            --pink-secondary: #FF1493;
            --purple-primary: #9370DB;
            --purple-secondary: #8A2BE2;
            --gold: #FFD700;
            --green: #90EE90;
            --orange: #FFA500;
            --red: #FF6B6B;
            --gray: #95a5a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--pink-primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
        }

        html, body {
            margin: 0;
            font-family: 'Rubik', helvetica, arial, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            position: relative;
            margin: 20px auto;
            padding: 0 20px;
            max-width: 1400px;
            width: 100%;
        }

        .main-area {
            background: rgba(255, 255, 255, 0.90);
            padding: 30px;
            margin: 0 auto 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 1px 3px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px 20px;
            text-align: center;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Rubik', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--pink-secondary);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-family: 'Rubik', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin: 30px 0 20px 0;
            color: var(--purple-secondary);
        }

        h3 {
            font-family: 'Rubik', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin: 20px 0 10px 0;
            color: var(--pink-primary);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: #666;
        }

        .button {
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-secondary));
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-family: 'Rubik', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 5px;
            margin: 8px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: rgba(0, 0, 0, 0.25) 0px 4px 10px;
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-secondary));
        }

        .button-small {
            padding: 8px 18px;
            font-size: 13px;
        }

        .cast-selection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .pokemon-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            text-align: center;
        }

        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 15px;
        }

        .pokemon-card.selected {
            border-color: var(--pink-primary);
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.1), rgba(255, 20, 147, 0.1));
            box-shadow: rgba(255, 105, 180, 0.4) 0px 4px 15px;
        }

        .pokemon-card.eliminated {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .pokemon-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
            transition: all 0.3s ease;
        }

        .pokemon-card:hover .pokemon-image {
            transform: scale(1.1);
        }

        .pokemon-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-align: center;
            color: #333;
        }

        .stats {
            font-size: 13px;
            margin-top: 10px;
            color: #666;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .track-record-table {
            width: 100%;
            margin: 30px auto;
            border-collapse: collapse;
            color: #3A3A3A;
            background-color: #E9DFE9;
            border: 1px solid #C6BFC6;
        }

        .track-record-table table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
            color: #3A3A3A;
            background-color: #E9DFE9;
            border: 1px solid #C6BFC6;
        }

        .track-record-table th {
            font-weight: bold;
            padding: 5px;
            background-color: #E9DFE9;
            border: 1px solid #C6BFC6;
            font-size: 13px;
            text-align: center;
            width: 75px;
        }

        .track-record-table th:first-child {
            width: 150px;
            text-align: left;
        }

        .track-record-table td {
            padding: 0.5em;
            border: 1px solid #C6BFC6;
            background-color: #F5EBF5;
            font-size: 13px;
            text-align: center;
        }

        .track-record-table td:first-child {
            text-align: left;
            font-weight: bold;
        }

        .track-record-table tr:hover td {
            background-color: #EDE3ED;
        }

        .placement-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            min-width: 55px;
        }

        .WIN {
            background: var(--gold);
            color: black;
        }
        .HIGH {
            background: var(--green);
            color: black;
        }
        .SAFE {
            background: var(--gray);
            color: white;
        }
        .LOW {
            background: var(--orange);
            color: black;
        }
        .BTM2 {
            background: var(--red);
            color: white;
        }
        .ELIM {
            background: #555;
            color: white;
        }
        .RUNNER {
            background: linear-gradient(135deg, silver, darkgray);
            color: black;
        }
        .WINNER {
            background: linear-gradient(135deg, gold, #FFD700);
            color: black;
            font-weight: 900;
        }

        .phase-container {
            background: rgba(255, 255, 255, 0.90);
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
        }

        .entrance-sequence {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .entrance-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
        }

        .entrance-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        .entrance-quote {
            flex: 1;
            font-style: italic;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .promo-card {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
            transition: all 0.3s ease;
        }

        .promo-card:hover {
            transform: translateY(-5px);
            box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 15px;
        }

        .promo-card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        .challenge-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .challenge-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .challenge-card:hover {
            border-color: var(--pink-primary);
            transform: translateY(-5px);
            box-shadow: rgba(255, 105, 180, 0.3) 0px 4px 15px;
        }

        .performance-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .performance-item {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
        }

        .performance-queen {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--pink-primary);
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .result-category {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--purple-secondary);
        }

        .result-queens {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .queen-badge {
            padding: 8px 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-secondary));
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .lipsync-battle {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: center;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 10px;
        }

        .lipsync-queens {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 30px 0;
            flex-wrap: wrap;
            gap: 30px;
        }

        .lipsync-queen {
            text-align: center;
        }

        .lipsync-queen img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(255, 105, 180, 0.4));
        }

        .vs {
            font-family: 'Rubik', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--pink-secondary);
        }

        .producer-room {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            margin: 30px 0;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 10px;
        }

        .episode-override {
            background: rgba(255, 255, 255, 0.6);
            padding: 25px;
            border-radius: 10px;
            margin: 25px 0;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .placement-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .placement-select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            background: white;
            font-family: 'Rubik', sans-serif;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }

        .placement-select:focus {
            outline: none;
            border-color: var(--pink-primary);
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
        }

        .drama-box {
            background: rgba(255, 215, 0, 0.15);
            padding: 25px;
            border-radius: 10px;
            margin: 25px 0;
            border-left: 5px solid var(--gold);
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
        }

        .tea-spill {
            font-style: italic;
            margin: 10px 0;
            color: #555;
            line-height: 1.6;
        }

        .storyline-tag {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-secondary));
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin: 4px;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .hidden {
            display: none;
        }

        .season-stats {
            background: rgba(255, 255, 255, 0.90);
            padding: 35px;
            border-radius: 10px;
            margin: 30px 0;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #f0f0f0;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: rgba(255, 105, 180, 0.3) 0px 4px 15px;
            border-color: var(--pink-primary);
        }

        .stat-value {
            font-family: 'Rubik', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--pink-secondary);
        }

        .stat-label {
            font-size: 14px;
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }

        .relationship-web {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin: 25px 0;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px;
        }

        .relationship-item {
            padding: 15px;
            margin: 12px 0;
            background: rgba(255, 105, 180, 0.08);
            border-radius: 8px;
            font-size: 14px;
            color: #555;
            border-left: 4px solid var(--pink-primary);
        }

        .finale-stage {
            background: rgba(255, 215, 0, 0.2);
            padding: 45px;
            border-radius: 10px;
            text-align: center;
            box-shadow: rgba(255, 215, 0, 0.4) 0px 4px 20px;
            border: 3px solid var(--gold);
        }

        .top4-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .finalist-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 3px solid var(--gold);
            transition: all 0.3s ease;
        }

        .finalist-card:hover {
            transform: translateY(-5px);
            box-shadow: rgba(255, 215, 0, 0.5) 0px 6px 20px;
        }

        .crown-icon {
            font-size: 3.5rem;
            margin: 15px 0;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--pink-primary);
        }

        .selection-count {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-secondary));
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: rgba(255, 105, 180, 0.4) 0px 4px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 999;
        }

        .error-message {
            background: linear-gradient(135deg, var(--red), #e74c3c);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            font-weight: 600;
            box-shadow: rgba(255, 107, 107, 0.4) 0px 4px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 PokéDrag Race Simulator 🌟</h1>
            <p class="subtitle">Gotta Slay 'Em All!</p>
        </header>

        <div class="main-area">
            <div id="app"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
