<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDrag Race Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Mono', monospace;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(-5%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }
            50% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .8;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .animate-slideIn {
            animation: slideIn 0.5s ease;
        }

        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .gradient-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            background-size: 1000px 100%;
            animation: shimmer 3s infinite;
        }

        .sprite-pixel {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'drag-pink': '#FF69B4',
                        'drag-pink-dark': '#FF1493',
                        'drag-purple': '#9370DB',
                        'drag-purple-dark': '#8A2BE2',
                        'cream': '#F4EFEA',
                        'win': '#FFD700',
                        'high': '#90EE90',
                        'safe': '#C8C8C8',
                        'low': '#FFC864',
                        'btm': '#FF6464',
                        'elim': '#323232',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-drag-pink to-drag-pink-dark text-white p-6 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold drop-shadow-lg">🌟 PokéDrag Race Simulator 🌟</h1>
            <p class="text-lg mt-2 opacity-95">Gotta Slay 'Em All!</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 md:px-8 lg:px-16 py-8 md:py-16">
        <div id="app"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
